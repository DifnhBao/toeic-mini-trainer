name: Drain pending ingestion jobs

on:
  schedule:
    # Hourly recovery sweep for personal staging; new jobs also start immediately.
    # Keep private-repo Actions usage well below the GitHub Pro monthly allowance.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'readiness-only chỉ kiểm tra; drain có thể ghi DB và gọi AI'
        type: choice
        default: readiness-only
        options: [readiness-only, drain]

permissions:
  contents: read

concurrency:
  group: ingestion-worker-staging
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Call authenticated staging worker
        shell: bash
        env:
          WORKER_URL: ${{ secrets.INGESTION_WORKER_URL }}
          WORKER_SECRET: ${{ secrets.INGESTION_WORKER_SECRET }}
          WORKER_MODE: ${{ github.event_name == 'schedule' && 'drain' || inputs.mode || 'readiness-only' }}
        run: |
          set -euo pipefail
          node scripts/run-worker-check.mjs
